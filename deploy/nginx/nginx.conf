#user  nobody;
worker_processes  4;

error_log  /app/logs/nginx/error.log;
error_log  /app/logs/nginx/error.log  notice;
error_log  /app/logs/nginx/error.log  info;

pid        /var/log/nginx/nginx.pid;

events {
    worker_connections  65535;
}

http {
    server_names_hash_bucket_size 64;

    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /app/logs/nginx/access.log  main;

    sendfile        on;
    client_max_body_size 500m;  # 增大上传限制以支持3D模型文件
    keepalive_timeout  65;

    # 基本的gzip配置就够了
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80 default_server;
        access_log  /app/logs/nginx/server_access.log;
        error_log   /app/logs/nginx/server_error.log;

        location /media/ {
           alias /app/media/;
        }

        location /static/ {
            alias /app/static_collected/;
        }

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version  1.1;
            proxy_cache_bypass  $http_upgrade;

            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         "upgrade";
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host   $host;
            proxy_set_header X-Forwarded-Port   $server_port;
            proxy_set_header X-NginX-Proxy $http_x_nginx_proxy;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;            

            proxy_cache off;  # 关闭缓存
            proxy_buffering off;  # 关闭代理缓冲
            chunked_transfer_encoding on;  # 开启分块传输编码
            tcp_nopush on;  # 开启TCP NOPUSH选项，禁止Nagle算法
            tcp_nodelay on;  # 开启TCP NODELAY选项，禁止延迟ACK算法
            keepalive_timeout 300;  # 设定keep-alive超时时间为65秒
        }
    }
}
