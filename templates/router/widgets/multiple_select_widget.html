{% load static %}

<div class="max-w-2xl relative" id="multiple-select-container-{{ widget.name }}" {% if widget.readonly %}readonly{% endif %}>
    <!-- 显示区域 -->
    <div class="border border-base-200 bg-white font-medium min-w-20 placeholder-base-400 rounded-default shadow-xs text-font-default-light text-sm focus:outline-2 focus:-outline-offset-2 focus:outline-primary-600 group-[.errors]:border-red-600 focus:group-[.errors]:outline-red-600 dark:bg-base-900 dark:border-base-700 dark:text-font-default-dark dark:group-[.errors]:border-red-500 dark:focus:group-[.errors]:outline-red-500 dark:scheme-dark group-[.primary]:border-transparent p-3">
        <div class="flex flex-wrap gap-2" id="selected-items-{{ widget.name|slugify }}">
            {% for value, label in widget.choices %}
                <label class="inline-flex items-center gap-1 px-2 py-1 rounded cursor-pointer select-none {% if value in widget.value %}bg-primary-100 text-primary-700{% else %}bg-gray-100 text-gray-500{% endif %}" data-value="{{ value }}">
                    <span>{{ label }}</span>
                    {% if value in widget.value %}
                        <span class="material-symbols-outlined text-sm">check</span>
                    {% endif %}
                </label>
            {% endfor %}
        </div>
    </div>

    <!-- 错误提示 -->
    <div class="hidden mt-1.5 px-3 py-2 bg-white border border-red-500 rounded text-red-500 text-sm" id="error-message-{{ widget.name|slugify }}">
        <span class="error-text"></span>
    </div>

    <!-- 隐藏的输入字段 -->
    <input type="hidden" 
           name="{{ widget.name }}" 
           id="json-input-{{ widget.name|slugify }}"
           value="{{ widget.json_value }}"
           data-min-selected="{{ widget.min_selected }}">
</div>
